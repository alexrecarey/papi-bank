<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Papi Bank 🐷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#22304f; --navy2:#2e4066; --teal:#2ec4b6; --coral:#ff6f61;
    --sun:#ffd166; --cream:#fff9ef; --ink:#2b2b3a; --muted:#8a8fa3;
    --green:#0a9d58; --red:#e05252; --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:'Nunito',-apple-system,system-ui,sans-serif;
    background:var(--cream); color:var(--ink);
    background-image:radial-gradient(circle at 15% 0%, #fff3d6 0, transparent 40%),
                     radial-gradient(circle at 90% 10%, #d9f7f3 0, transparent 35%);
    min-height:100vh;
  }
  .top{
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:#fff; padding:28px 20px 84px; text-align:center;
    border-radius:0 0 32px 32px;
  }
  .logo{width:96px;height:96px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    background:#fff; object-fit:cover;}
  .top h1{font-family:'Fredoka',sans-serif;font-size:2.4rem;margin:12px 0 4px;letter-spacing:.5px;}
  .top h1 .pig{font-size:2rem;}
  .tagline{margin:0;opacity:.85;font-weight:600;}
  .wrap{max-width:880px;margin:-64px auto 0;padding:0 16px 40px;}
  .switcher{display:flex;gap:10px;justify-content:center;margin-bottom:18px;}
  .switcher button{
    font-family:'Fredoka',sans-serif;font-size:1.15rem;font-weight:600;
    border:none;border-radius:999px;padding:12px 34px;cursor:pointer;
    background:transparent;color:#fff;box-shadow:none;
    min-height:52px;transition:transform .12s;
  }
  .switcher button:active{transform:scale(.96);}
  .switcher button.active{background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(34,48,79,.12);}
  .balance-card{
    background:var(--card);border-radius:28px;padding:30px 24px;text-align:center;
    box-shadow:0 12px 32px rgba(34,48,79,.14);position:relative;overflow:hidden;
  }
  .balance-card::before{
    content:"";position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,var(--sun) 0 60%, transparent 61%);opacity:.5;
  }
  .balance-card::after{
    content:"";position:absolute;bottom:-50px;left:-30px;width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle,var(--teal) 0 60%, transparent 61%);opacity:.25;
  }
  .balance-card .label{font-weight:800;color:var(--muted);text-transform:uppercase;
    letter-spacing:1.5px;font-size:.85rem;margin:0;}
  .balance{font-family:'Fredoka',sans-serif;font-size:4rem;font-weight:700;color:var(--navy);
    margin:8px 0 4px;line-height:1;}
  .updated{color:var(--muted);font-size:.9rem;margin:0;font-weight:600;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 26px;}
  .stat{background:var(--card);border-radius:20px;padding:16px 8px;text-align:center;
    box-shadow:0 6px 18px rgba(34,48,79,.08);}
  .stat-num{display:block;font-family:'Fredoka',sans-serif;font-size:1.6rem;font-weight:700;color:var(--navy);}
  .stat-label{font-size:.85rem;color:var(--muted);font-weight:700;}
  h2{font-family:'Fredoka',sans-serif;font-size:1.5rem;color:var(--navy);margin:6px 4px 14px;}
  .move{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;
    display:flex;align-items:center;gap:14px;box-shadow:0 4px 14px rgba(34,48,79,.07);}
  .move .ic{font-size:1.9rem;width:54px;height:54px;flex:0 0 54px;display:flex;align-items:center;
    justify-content:center;background:#f2f5fb;border-radius:16px;}
  .move .info{flex:1;min-width:0;}
  .move .desc{font-weight:700;font-size:1rem;line-height:1.3;}
  .move .date{color:var(--muted);font-size:.85rem;font-weight:600;margin-top:2px;}
  .move .amt{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.25rem;white-space:nowrap;}
  .move .amt.pos{color:var(--green);} .move .amt.neg{color:var(--red);}
  .more{display:block;width:100%;margin:8px 0 0;padding:18px;border:none;border-radius:20px;
    background:var(--teal);color:#fff;font-family:'Fredoka',sans-serif;font-size:1.2rem;font-weight:600;
    cursor:pointer;box-shadow:0 8px 20px rgba(46,196,182,.35);min-height:60px;}
  .more:active{transform:scale(.98);}
  .more.hidden{display:none;}
  .empty{background:var(--card);border-radius:20px;padding:40px 20px;text-align:center;
    color:var(--muted);font-weight:700;font-size:1.1rem;box-shadow:0 4px 14px rgba(34,48,79,.07);}
  .empty .big{font-size:3rem;display:block;margin-bottom:10px;}
  footer{text-align:center;color:var(--muted);font-weight:600;font-size:.9rem;padding:26px 16px 40px;}
  @media (max-width:520px){
    .balance{font-size:3.2rem;}
    .top h1{font-size:2rem;}
    .stats{gap:8px;} .stat-num{font-size:1.25rem;}
  }
</style>
</head>
<body>
  <header class="top">
    <img class="logo" src="%%LOGO%%" alt="Papi Bank logo">
    <h1>Papi Bank <span class="pig">🐷</span></h1>
    <p class="tagline">The coolest bank for kids</p>
  </header>

  <div class="wrap">
    <div class="switcher" role="tablist">
      <button data-acct="Alejandro" class="active" role="tab">Alejandro</button>
      <button data-acct="Juliana" role="tab">Juliana</button>
    </div>

    <section class="balance-card">
      <p class="label"><span id="acctName">Alejandro</span>'s balance</p>
      <p class="balance" id="balance">$0.00</p>
      <p class="updated" id="updated"></p>
    </section>

    <section class="stats">
      <div class="stat"><span class="stat-num" id="statBooks">0</span><span class="stat-label">📚 books read</span></div>
      <div class="stat"><span class="stat-num" id="statEarned">$0.00</span><span class="stat-label">💰 total earned</span></div>
      <div class="stat"><span class="stat-num" id="statMoves">0</span><span class="stat-label">🧾 movements</span></div>
    </section>

    <section>
      <h2>Recent activity</h2>
      <div id="moves"></div>
      <button id="more" class="more">Load more ⬇️</button>
    </section>
  </div>

  <footer>Made with 💛 for Alejandro &amp; Juliana · Papi Bank</footer>

<script>
const DATA = %%DATA%%;
const PAGE = 20;
let current = 'Alejandro';
let shown = PAGE;

const $ = id => document.getElementById(id);
const money = n => (n < 0 ? '−$' : '$') + Math.abs(n).toFixed(2);

function iconFor(m){
  if (m.amount < 0) return '🛍️';
  if (m.desc.indexOf('AR:') === 0) return '📖';
  if (/chore/i.test(m.desc)) return '🧹';
  return '🎁';
}
function prettyDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T12:00:00');
  return isNaN(dt) ? d : dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function animateBalance(target){
  const el = $('balance');
  const start = performance.now(), dur = 700;
  const from = 0;
  function tick(t){
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = money(from + (target - from) * eased);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function render(){
  const a = DATA[current];
  $('acctName').textContent = a.name;
  animateBalance(a.balance);
  $('updated').textContent = 'Updated ' + a.updated;
  $('statBooks').textContent = a.books;
  $('statEarned').textContent = money(a.deposits);
  $('statMoves').textContent = a.movements.length;

  const box = $('moves');
  box.innerHTML = '';
  if (!a.movements.length){
    box.innerHTML = '<div class="empty"><span class="big">🎉</span>No movements yet.<br>Time to start earning!</div>';
  }
  a.movements.slice(0, shown).forEach(m => {
    const row = document.createElement('div');
    row.className = 'move';
    const pos = m.amount >= 0;
    row.innerHTML =
      '<div class="ic">' + iconFor(m) + '</div>' +
      '<div class="info"><div class="desc"></div><div class="date">' + prettyDate(m.date) + '</div></div>' +
      '<div class="amt ' + (pos ? 'pos' : 'neg') + '">' + (pos ? '+' : '−') + money(m.amount).slice(1) + '</div>';
    row.querySelector('.desc').textContent = m.desc;
    box.appendChild(row);
  });
  $('more').classList.toggle('hidden', shown >= a.movements.length);
}

document.querySelectorAll('.switcher button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.switcher button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    current = b.dataset.acct;
    shown = PAGE;
    render();
  });
});
$('more').addEventListener('click', () => { shown += PAGE; render(); });

render();
</script>
</body>
</html>
